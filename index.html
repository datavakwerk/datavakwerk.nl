<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- De fonts staan lokaal in /fonts; deze twee zijn zichtbaar bij de eerste
         schermvulling en worden daarom vooraf geladen. -->
    <link
      rel="preload"
      href="/fonts/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/space-grotesk-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#1d4ed8" />

    <!--seo-start-->
    <title>Datavakwerk — freelance business- &amp; data-analist voor de publieke sector</title>
    <meta
      name="description"
      content="Zelfstandig business- en data-analist voor de (rijks)overheid. Stuurinformatie die klopt, procesanalyse op de werkvloer en businesscases waarin elk getal herleidbaar is."
    />
    <link rel="canonical" href="https://datavakwerk.nl/" />
    <!--/seo-end-->

    <!-- Zonder JavaScript draait de scroll-animatie niet; laat de inhoud dan
         gewoon staan in plaats van op opacity 0. -->
    <noscript>
      <style>
        .reveal {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
