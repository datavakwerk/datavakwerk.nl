<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1f44"/>
      <stop offset="55%" stop-color="#102a5c"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Volledig vierkant vullen zodat de uitsnede naadloos is. -->
  <rect width="1200" height="1200" fill="url(#bg)"/>

  <!-- De 1200x630 kaart staat verticaal gecentreerd; sips snijdt die band eruit. -->
  <g transform="translate(0 285)">
    <g opacity="0.16" fill="#93c5fd">
      <rect x="812" y="470" width="42" height="90" rx="8"/>
      <rect x="874" y="410" width="42" height="150" rx="8"/>
      <rect x="936" y="330" width="42" height="230" rx="8"/>
      <rect x="998" y="238" width="42" height="322" rx="8"/>
    </g>
    <circle cx="1019" cy="196" r="20" fill="#ffe099" opacity="0.85"/>

    <g transform="translate(84 74) scale(1.6)">
      <circle cx="16" cy="16" r="16" fill="#1d4ed8"/>
      <rect x="9" y="18" width="3.5" height="6" rx="1" fill="#93c5fd"/>
      <rect x="14.25" y="13" width="3.5" height="11" rx="1" fill="#93c5fd"/>
      <rect x="19.5" y="9" width="3.5" height="15" rx="1" fill="#93c5fd"/>
      <circle cx="21.25" cy="6" r="2" fill="#ffe099"/>
    </g>
    <text x="146" y="112" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
          font-size="34" font-weight="700" fill="#ffffff">Datavakwerk</text>

    <rect x="84" y="168" width="380" height="4" rx="2" fill="url(#rule)"/>

    <text x="84" y="262" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
          font-size="54" font-weight="700" fill="#ffffff">Business- &amp; data-analyse</text>
    <text x="84" y="330" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
          font-size="54" font-weight="700" fill="#93c5fd">voor de publieke sector</text>

    <text x="84" y="410" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
          font-size="24" fill="#c7d7f5">Stuurinformatie die klopt · procesanalyse op de</text>
    <text x="84" y="446" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
          font-size="24" fill="#c7d7f5">werkvloer · businesscases die herleidbaar zijn</text>

    <text x="84" y="546" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
          font-size="24" font-weight="600" fill="#ffffff" opacity="0.6">datavakwerk.nl</text>
  </g>
</svg>
