server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  charset utf-8;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml application/javascript
             application/json application/xml image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # De canonical staat zonder slash (/blog), dus stuur /blog/ daarheen in
  # plaats van andersom. De .+ zorgt dat / zelf buiten schot blijft.
  rewrite ^/(.+)/$ /$1 permanent;

  location = / {
    try_files /index.html =404;
  }

  # Elke route is een echt bestand: /blog -> /blog/index.html. Bewust geen
  # $uri/ in try_files, want dat geeft een 301 naar de trailing-slash-variant
  # en dan zou de canonical-URL zelf doorverwijzen. Ook geen SPA-fallback,
  # zodat een onbekende URL een echte 404 geeft in plaats van een soft-404.
  location / {
    try_files $uri $uri/index.html =404;
  }

  # Vite-assets en fonts hebben een hash of een vaste naam en veranderen alleen
  # bij een nieuwe deploy.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    try_files $uri =404;
  }

  location /fonts/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    try_files $uri =404;
  }

  # HTML nooit lang cachen: een nieuwe deploy moet meteen zichtbaar zijn.
  location ~* \.html$ {
    expires -1;
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  location = /sitemap.xml {
    expires 1h;
  }

  location = /robots.txt {
    expires 1d;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
    expires -1;
    add_header Cache-Control "no-cache" always;
  }
}
