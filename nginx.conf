server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  charset utf-8;
  index index.html;

  # Achter de Traefik-proxy van Dokploy; laat die de compressie niet overdoen.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml application/javascript
             application/json application/xml image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Elke route is een echt bestand: /blog/x -> /blog/x/index.html.
  # Geen SPA-fallback, zodat een onbekende URL een echte 404 geeft en Google
  # geen soft-404 indexeert.
  location / {
    try_files $uri $uri/ $uri/index.html =404;
  }

  # Vite-assets hebben een hash in de naam en mogen onbeperkt gecachet worden.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    try_files $uri =404;
  }

  location /fonts/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    types { font/woff2 woff2; }
    try_files $uri =404;
  }

  # HTML nooit lang cachen: een nieuwe deploy moet meteen zichtbaar zijn.
  location ~* \.html$ {
    expires -1;
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  location = /sitemap.xml {
    expires 1h;
    types { application/xml xml; }
  }

  location = /robots.txt {
    expires 1d;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
    expires -1;
    add_header Cache-Control "no-cache" always;
  }
}
